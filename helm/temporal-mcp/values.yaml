# Required. The server's config file, as YAML text, usually passed with
# --set-file config=config.yaml. See docs/config.md in
# https://github.com/temporalio/temporal-mcp. Without auth, the server listens
# only on loopback, so only kubectl port-forward reaches it.
config: ""

image:
  # The image repository.
  repository: temporalio/temporal-mcp
  # The image tag, by default the version of the release the chart comes from.
  tag: ""
  # When to pull the image.
  pullPolicy: IfNotPresent
# Secrets with the credentials for pulling the image.
imagePullSecrets: []

# The number of server pods.
replicaCount: 1

# Environment variables of the server, such as the API keys that config reads
# with env:, taken from Secrets.
env: []
# Sources of environment variables, such as a whole Secret.
envFrom: []
# Volumes of the files that config names, such as certificates from Secrets.
volumes: []
# Where the server's container mounts the volumes.
volumeMounts: []

service:
  # The Service type.
  type: ClusterIP
  # The Service port, by default the port of config's listen address.
  port: null
  # Annotations of the Service, such as one that makes a LoadBalancer internal.
  annotations: {}

# Annotations of the server pods.
podAnnotations: {}
# The service account of the server pods, such as one a secret-store CSI driver
# authenticates as.
serviceAccountName: ""
# How long Kubernetes waits before SIGKILL, 30 seconds if unset, counting the
# preStop sleep, which runs before SIGTERM. Keep it at least a second longer
# than the sleep plus config's shutdown_timeout.
terminationGracePeriodSeconds: null
# The server container's readiness probe, by default a GET of /healthz on the
# mcp port, over HTTPS when config sets listen_tls. Set it to null to drop it;
# {} keeps the default, since Helm merges maps.
readinessProbe:
  httpGet:
    path: /healthz
    port: mcp
# The server container's lifecycle hooks. The preStop sleep, which needs
# Kubernetes 1.30 or later, delays SIGTERM while the pod leaves the Service's
# endpoints. Set lifecycle to null to drop it; {} keeps it, since Helm merges maps.
lifecycle:
  preStop:
    sleep:
      seconds: 15
# The pod security context, which fits the image's non-root user.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# The server container's security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
# The server container's resource requests and limits.
resources: {}
# Scheduling constraints of the server pods.
nodeSelector: {}
tolerations: []
affinity: {}
