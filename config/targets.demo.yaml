# Local targets used by the acceptance fixtures and contributor demos.
# `demo-support` and `demo-platform` are local access groups selected with OPS_MCP_GROUP. They are
# not Temporal groups. Both groups below are intentionally allowed to see the same demo target.
groups:
  demo-support:
    targets:
      # Canonical target name returned to the agent and reused in MCP tool calls. It is not the
      # name of a Temporal resource.
      orders-prod:
        # Human-friendly resolution names; the first alias becomes the displayed target name.
        aliases:
          - orders prod
          - production orders
        # Optional metadata returned to the agent. These labels do not affect the connection.
        account: local-demo
        cluster: temporal-dev
        # The real Namespace and frontend endpoint of the local Temporal dev server.
        namespace: default
        address: 127.0.0.1:7233
        # The local demo server uses plaintext rather than TLS.
        tls: false
  demo-platform:
    targets:
      # This repeats the same destination under another access group for authorization tests.
      orders-prod:
        aliases:
          - orders prod
        account: local-demo
        cluster: temporal-dev
        namespace: default
        address: 127.0.0.1:7233
        tls: false
