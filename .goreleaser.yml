version: 2

project_name: temporal-mcp

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - files:
      - LICENSE
      - README.md
      - docs/*
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  header: |
    `temporal-mcp` is a read-only MCP server that gives AI agents access to Temporal namespaces. To install it, follow [Get started](https://github.com/temporalio/temporal-mcp#get-started) in the README, which downloads the archive for your platform (not the "Source code" links) with `gh`.
  draft: true
  replace_existing_draft: true
  prerelease: auto
