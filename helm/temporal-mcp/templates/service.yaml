apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "temporal-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "temporal-mcp.labels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port | default (include "temporal-mcp.listenPort" .) }}
      targetPort: mcp
