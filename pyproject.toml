[project]
name = "ops-mcp"
version = "0.1.0"
description = "Read-only Temporal operations MCP prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29,<1.30",
  "protobuf>=7.35,<8",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "temporalio>=1.31,<1.32",
]

[project.scripts]
ops-mcp = "ops_mcp.mcp:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
