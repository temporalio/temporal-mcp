name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/ .
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm lint --strict -f examples/helm-values.yaml --set-file config=examples/http-auth-config.yaml helm/temporal-mcp
      - run: helm lint --strict -f examples/helm-values.yaml --set-file config=examples/http-auth-config.yaml --set watchConfig=true helm/temporal-mcp
      - run: |
          checksum() { helm template temporal-mcp helm/temporal-mcp --set watchConfig=true --set-file config="$1" | grep 'checksum/config:'; }
          sed 's/claim_value: payments-dev,/claim_value: payments-devs,/' examples/http-auth-config.yaml > "$RUNNER_TEMP/rules.yaml"
          sed 's|issuer: https://login.example.com/|issuer: https://login2.example.com/|' examples/http-auth-config.yaml > "$RUNNER_TEMP/auth.yaml"
          sed 's|audience: https://temporal-mcp.example.com/mcp|audience: 0123|' examples/http-auth-config.yaml > "$RUNNER_TEMP/unquoted.yaml"
          sed 's|audience: https://temporal-mcp.example.com/mcp|audience: "0123"|' examples/http-auth-config.yaml > "$RUNNER_TEMP/quoted.yaml"
          cmp -s examples/http-auth-config.yaml "$RUNNER_TEMP/rules.yaml" && exit 1
          cmp -s examples/http-auth-config.yaml "$RUNNER_TEMP/auth.yaml" && exit 1
          test "$(checksum examples/http-auth-config.yaml)" = "$(checksum "$RUNNER_TEMP/rules.yaml")"
          test "$(checksum examples/http-auth-config.yaml)" != "$(checksum "$RUNNER_TEMP/auth.yaml")"
          checksum "$RUNNER_TEMP/unquoted.yaml" && exit 1
          checksum "$RUNNER_TEMP/quoted.yaml"
          helm template temporal-mcp helm/temporal-mcp --set watchConfig=true --set-file config=examples/http-auth-config.yaml | grep -F 'args: [--config, /config/config.yaml, --watch-config]'

  build-and-test:
    needs: [test, helm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$TEST" = success && test "$HELM" = success
        env:
          TEST: ${{ needs.test.result }}
          HELM: ${{ needs.helm.result }}
