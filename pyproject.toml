[project]
name = "ops-mcp"
version = "0.1.0"
description = "Read-only Temporal operations MCP prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27.2,<2",
  "pyyaml>=6.0,<7",
  "temporalio>=1.18.0,<2",
]

[project.scripts]
ops-mcp = "ops_mcp.mcp:main"
ops-mcp-generalized = "ops_mcp.mcp:main"
ops-mcp-direct-reads = "ops_mcp.mcp:main"
ops-mcp-poc = "ops_mcp.mcp:main"
ops-mcp-session-one = "ops_mcp.server:main"
ops-mcp-demo-worker = "ops_mcp.demo.worker:main"
ops-mcp-demo-seed = "ops_mcp.demo.seed:main"
ops-mcp-demo-session = "ops_mcp.demo.session:main"
ops-mcp-stuck-worker = "ops_mcp.demo_stuck.worker:main"
ops-mcp-stuck-seed = "ops_mcp.demo_stuck.seed:main"
ops-mcp-nondeterminism-v1-worker = "ops_mcp.demo_nondeterminism.worker_v1:main"
ops-mcp-nondeterminism-v2-worker = "ops_mcp.demo_nondeterminism.worker_v2:main"
ops-mcp-nondeterminism-seed = "ops_mcp.demo_nondeterminism.seed:main"
ops-mcp-nondeterminism-expose = "ops_mcp.demo_nondeterminism.expose:main"
ops-mcp-incident-workflow-worker = "ops_mcp.demo_incident.workflow_worker:main"
ops-mcp-incident-activity-worker = "ops_mcp.demo_incident.activity_worker:main"
ops-mcp-incident-seed = "ops_mcp.demo_incident.seed:main"
ops-mcp-acceptance = "ops_mcp.acceptance.runner:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
