version: 2

project_name: temporal-mcp

before:
  hooks:
    # Into bin, since dist must be empty until GoReleaser fills it.
    - helm package helm/temporal-mcp --version {{ .Version }} --app-version {{ .Version }} --destination bin

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - files:
      - LICENSE
      - README.md
      - docs/*
      - examples/*

checksum:
  name_template: checksums.txt
  extra_files: &chart
    - glob: bin/temporal-mcp-{{ .Version }}.tgz

changelog:
  use: github-native

release:
  header: |
    `temporal-mcp` is an MCP server that gives AI agents access to Temporal namespaces. To install it, follow [Get started](https://github.com/temporalio/temporal-mcp#get-started) in the README.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  extra_files: *chart
