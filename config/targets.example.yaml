# Copy this file to config/targets.yaml and replace the placeholder values.
# OPS_MCP_GROUP selects one of the groups below until a transport identity provider is available.
groups:
  operators:
    targets:
      payments-prod:
        aliases:
          - payments prod
          - production payments
        account: your-account
        cluster: payments
        namespace: "<namespace>.<account-id>"
        address: "<namespace>.<account-id>.tmprl.cloud:7233"
        tls: true
        api_key_env: TEMPORAL_API_KEY
