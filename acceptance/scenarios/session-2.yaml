version: 1
name: operator-mcp-session-2
session:
  provider: codex
  sandbox: read-only
  approvalPolicy: never
  ephemeral: true
  targetMcp: |
    {
      "name": "temporal-operator",
      "transport": "stdio",
      "command": {{json .Server}},
      "args": ["--stdio", "--config", {{json .Config}}],
      "cwd": {{json .Root}},
      "expectedTools": ["list_available_targets", "get_workflow", "get_workflow_history", "get_task_queue"]
    }
prompts:
  - "In orders prod, is payment-reconciliation-main currently stuck? It normally finishes within 15 minutes. Please investigate."
  - "Can this exact workflow dispatch its pending work right now, and what does the evidence not tell us?"
