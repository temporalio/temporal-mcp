version: 1
name: operator-mcp-session-2
session:
  provider: codex
  sandbox: read-only
  approvalPolicy: never
  ephemeral: true
  targetMcp: |
    {
      "name": "temporal-operator",
      "transport": "stdio",
      "command": __OPERATOR_MCP_JSON__,
      "args": ["--stdio", "--config", __TARGET_CONFIG_JSON__],
      "cwd": __REPO_ROOT_JSON__,
      "expectedTools": ["list_available_targets", "get_workflow", "get_workflow_history", "get_task_queue"]
    }
prompts:
  - "In orders prod, is session2-payment-reconciliation-main currently stuck? It normally finishes within 15 minutes. Please investigate."
  - "Can this exact workflow dispatch its pending work right now, and what does the evidence not tell us?"
