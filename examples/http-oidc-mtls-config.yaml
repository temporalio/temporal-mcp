# The centrally hosted MCP endpoint. Restrict network access according to your
# internal security model.
listen: 0.0.0.0:8443

# Serve the MCP endpoint over HTTPS.
listen_tls:
  cert_file: /etc/temporal-mcp/server/tls.crt # Example certificate path.
  key_file: /etc/temporal-mcp/server/tls.key # Example key path.

# User-to-MCP authentication. The resource must match the canonical MCP URL
# registered with the identity provider and sent by the client. The issuer must
# match the token's iss. The audience must match its aud value or one entry if
# aud is a list, and may differ from the resource URL. Each required scope must
# appear exactly in every access token.
auth:
  resource: https://temporal-mcp.example.com/mcp # Example MCP URL.
  issuer: https://id.example.com/ # Example identity provider issuer.
  audience: https://temporal-mcp.example.com/mcp # Example token aud claim.
  required_scopes:
    - https://temporal-mcp.example.com/mcp/access # Example token scope.

# User-to-tool-and-target authorization. A token claim assigns a profile; this
# file defines what that profile can use inside this MCP server.
authorization:
  profiles:
    example-all-reader: # Example profile with access to both targets.
      targets:
        - example-api-key-namespace # Example target name.
        - example-mtls-namespace # Example target name.

    example-api-key-reader: # Example profile with access to one target.
      targets:
        - example-api-key-namespace # Example target name.

  rules:
    - claim_name: groups # Example group claim in the access token.
      claim_value: example-all-readers # Example existing group name or ID.
      profile: example-all-reader # Refers to the profile above.
    - claim_name: groups # Example group claim in the access token.
      claim_value: example-api-key-readers # Example existing group name or ID.
      profile: example-api-key-reader # Refers to the profile above.

targets:
  # Prefer an API key from a read-only service account where API keys are
  # available. See docs/config.md#targets.
  - name: example-api-key-namespace # Example target name.
    description: Example Temporal Cloud namespace using an API key.
    address: api-key-example.a1b2c.tmprl.cloud:7233 # Example endpoint.
    namespace: api-key-example.a1b2c # Example namespace.
    api_key: {env: EXAMPLE_API_KEY}
    # Return payloads as Temporal stores them. Use omit to hide payload data, or
    # decode for codec-encrypted payloads.
    payload_handling: passthrough

  # Use mTLS for a Temporal Cloud namespace that cannot use API keys. Cloud
  # client certificates cannot be limited to Read, and mTLS targets do not get
  # Cloud Ops API enrichment.
  - name: example-mtls-namespace # Example target name.
    description: Example Temporal Cloud namespace using mTLS.
    address: mtls-example.d4e5f.tmprl.cloud:7233 # Example endpoint.
    namespace: mtls-example.d4e5f # Example namespace.
    tls:
      cert_file: /etc/temporal-mcp/targets/example.crt # Example certificate path.
      key_file: /etc/temporal-mcp/targets/example.key # Example key path.
    # Return payloads as Temporal stores them. Use omit to hide payload data, or
    # decode for codec-encrypted payloads.
    payload_handling: passthrough

# Keep audit records separate from diagnostic logs and collect both according
# to your organization's retention policy. Rotate them with copytruncate.
audit_log_file: /var/log/temporal-mcp/audit.jsonl
error_log_file: /var/log/temporal-mcp/server.log
