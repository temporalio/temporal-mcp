# HTTPS with auth, for a shared deployment: each caller signs in with the
# identity provider and gets the profiles its token's claims match.
# See docs/config.md.
listen: 0.0.0.0:8443
listen_tls:
  cert_file: /etc/temporal-operator-mcp/tls.crt
  key_file: /etc/temporal-operator-mcp/tls.key

auth:
  # Where MCP clients reach this server.
  resource: https://temporal-mcp.example.com/mcp
  issuers:
    - issuer: https://login.example.com/
      # Identifies this server as an API, never the app users sign in with.
      audience: https://temporal-mcp.example.com/mcp

authorization:
  profiles:
    oncall:
      tools: [list_available_targets, check_connection, get_workflows, get_workflow_history, get_task_queues, search_workflows, count_workflows, list_search_attributes]
      targets: [payments-prod, payments-staging, orders-prod]
    payments-dev:
      tools: [list_available_targets, get_workflows, get_workflow_history]
      targets: [payments-staging]
  rules:
    - {claim_name: groups, claim_value: temporal-oncall, profile: oncall}
    - {claim_name: groups, claim_value: payments-dev, profile: payments-dev}

targets:
  - name: payments-prod
    description: Production namespace of the payments service.
    address: payments-prod.a1b2c.tmprl.cloud:7233
    namespace: payments-prod.a1b2c
    api_key: {env: PAYMENTS_PROD_API_KEY}
  - name: payments-staging
    description: Staging namespace of the payments service.
    address: payments-staging.a1b2c.tmprl.cloud:7233
    namespace: payments-staging.a1b2c
    api_key: {env: PAYMENTS_STAGING_API_KEY}
  - name: orders-prod
    description: Production namespace of the orders service.
    address: orders-prod.a1b2c.tmprl.cloud:7233
    namespace: orders-prod.a1b2c
    api_key: {env: ORDERS_PROD_API_KEY}
